{{define "head"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.}} · gospel-engine</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a1f29; --text: #e5e9f0; --muted: #8b96a8;
    --accent: #7aa2f7; --accent-hover: #a6c4ff; --border: #2a2f3a; --code-bg: #0a0e14;
    --warn: #e0af68; --bad: #f7768e; --good: #9ece6a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.6; }
  .container { max-width: 760px; margin: 0 auto; padding: 3rem 1rem 5rem; }
  h1 { font-size: 1.8rem; margin: 0 0 0.25rem; letter-spacing: -0.02em; }
  h2 { font-size: 1.15rem; margin: 2rem 0 0.5rem; }
  a { color: var(--accent); } a:hover { color: var(--accent-hover); }
  .muted { color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; margin: 1rem 0; }
  .error { border-color: var(--bad); } .notice { border-color: var(--good); }
  code, .key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code-bg);
               padding: 0.1rem 0.35rem; border-radius: 4px; word-break: break-all; }
  .key { display: block; padding: 0.6rem 0.8rem; margin: 0.5rem 0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { text-align: left; padding: 0.45rem 0.4rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  .scroll { overflow-x: auto; }
  input[type=text], select { background: var(--code-bg); color: var(--text); border: 1px solid var(--border);
                             border-radius: 6px; padding: 0.45rem 0.6rem; font: inherit; max-width: 100%; }
  button { background: var(--accent); color: #0f1419; border: 0; border-radius: 6px; padding: 0.45rem 0.9rem;
           font: inherit; font-weight: 600; cursor: pointer; }
  button.quiet { background: transparent; color: var(--accent); border: 1px solid var(--border); font-weight: 500; }
  button.danger { background: var(--bad); }
  form.inline { display: inline; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  footer { margin-top: 3rem; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<div class="container">
{{end}}

{{define "foot"}}
<footer><a href="/">gospel-engine</a> · <a href="/keys">your keys</a> · <a href="/privacy">privacy</a></footer>
</div>
</body>
</html>
{{end}}
